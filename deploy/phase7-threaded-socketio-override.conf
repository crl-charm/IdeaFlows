# Phase 7 production override: threaded Flask-SocketIO with simple-websocket.
# Install as /etc/systemd/system/ideahub.service.d/override.conf only after the
# release dependencies have been installed successfully.
[Service]
ExecStart=
ExecStart=/var/www/pos/venv/bin/gunicorn --no-sendfile --worker-class gthread --threads 50 --workers 1 --bind 127.0.0.1:5000 --timeout 120 --graceful-timeout 30 --keep-alive 5 wsgi:application
