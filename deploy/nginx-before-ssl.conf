# ============================================================
# IdeaHub — Nginx config (HTTP only, BEFORE running Certbot)
# Install this first, then run certbot --nginx to get SSL.
#
# Usage:
#   sudo cp deploy/nginx-before-ssl.conf /etc/nginx/sites-available/ideahub
#   sudo ln -s /etc/nginx/sites-available/ideahub /etc/nginx/sites-enabled/ideahub
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d idea-flows.online -d www.idea-flows.online
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name idea-flows.online www.idea-flows.online;

    # Let Certbot handle ACME challenges for SSL certificate issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve static files directly from disk (faster, bypasses gunicorn)
    location /static/ {
        alias /var/www/ideahub/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy everything else to gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }

    # WebSocket support for Flask-SocketIO
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
