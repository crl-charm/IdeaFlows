# ============================================================
# IdeaHub — Nginx config (HTTP only, BEFORE running Certbot)
# Install this first, then run certbot --nginx to get SSL.
#
# Usage:
#   sudo cp deploy/nginx-before-ssl.conf /etc/nginx/sites-available/ideahub
#   sudo ln -s /etc/nginx/sites-available/ideahub /etc/nginx/sites-enabled/ideahub
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d idea-flows.online -d www.idea-flows.online
# ============================================================

# --- Anti-Scraper User-Agent Filtering ---
map $http_user_agent $bad_bot {
    default 0;
    ""      1; # Drop empty User-Agent
    ~*(?i)(scrapy|python-requests|aiohttp|httpclient|curl|wget|urllib|httpx|go-http-client) 1;
    ~*(?i)(sqlmap|nikto|masscan|zgrab|acunetix|havij|nmap|dirbuster|wpscan) 1;
    ~*(?i)(bytespider|petalbot|semrushbot|ahrefsbot|mj12bot|dotbot|megaindex|zoominfobot) 1;
}

# --- Rate Limiting & Connection Limiting Zones ---
limit_req_zone $binary_remote_addr zone=general_req:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=login_req:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=socketio_req:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name idea-flows.online www.idea-flows.online;

    # Drop bad bots immediately with zero response
    if ($bad_bot) {
        return 444;
    }

    # Timeouts against Slowloris
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Let Certbot handle ACME challenges for SSL certificate issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve robots.txt directly
    location = /robots.txt {
        alias /var/www/ideahub/static/robots.txt;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # Serve static files directly from disk (faster, bypasses gunicorn)
    location /static/ {
        alias /var/www/ideahub/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # WebSocket support for Flask-SocketIO (Carved out with higher limits)
    location /socket.io/ {
        limit_req zone=socketio_req burst=100 nodelay;
        limit_conn conn_ip 50;

        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dedicated login rate limit (loosened burst for shared NAT / office WiFi)
    location = /api/login {
        limit_req zone=login_req burst=20 nodelay;
        limit_conn conn_ip 10;

        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy everything else to gunicorn
    location / {
        limit_req zone=general_req burst=30 nodelay;
        limit_conn conn_ip 20;

        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }
}
