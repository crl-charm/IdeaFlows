# ============================================================
# IdeaHub — Nginx config (HTTPS, AFTER running Certbot)
# Certbot will auto-generate/update SSL certificate paths.
#
# Usage (after certbot has run):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ideahub
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name idea-flows.online www.idea-flows.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name idea-flows.online www.idea-flows.online;

    # --- SSL Certificates (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/idea-flows.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idea-flows.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-XSS-Protection          "1; mode=block"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Serve static files directly from disk ---
    # Much faster than routing through gunicorn; 1-year browser cache
    location /static/ {
        alias /var/www/ideahub/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- WebSocket support for Flask-SocketIO ---
    # Must come BEFORE the catch-all / block
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Proxy all other requests to gunicorn ---
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Allow menu image uploads up to 10MB
        client_max_body_size 10m;
    }

    # --- Custom error pages ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
