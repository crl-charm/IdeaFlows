# ============================================================
# IdeaHub — Nginx config (HTTPS, AFTER running Certbot)
# Certbot will auto-generate/update SSL certificate paths.
#
# Usage (after certbot has run):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ideahub
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# --- Anti-Scraper User-Agent Filtering ---
# Drops known automated scrapers, scanners, and empty user agents.
# Note: Sophisticated bots spoofing real browser UAs bypass this layer;
# rate limits and behavioral honeypots act as the true defense backstops.
map $http_user_agent $bad_bot {
    default 0;
    ""      1; # Drop empty User-Agent
    ~*(?i)(scrapy|python-requests|aiohttp|httpclient|curl|wget|urllib|httpx|go-http-client) 1;
    ~*(?i)(sqlmap|nikto|masscan|zgrab|acunetix|havij|nmap|dirbuster|wpscan) 1;
    ~*(?i)(bytespider|petalbot|semrushbot|ahrefsbot|mj12bot|dotbot|megaindex|zoominfobot) 1;
}

# --- Rate Limiting & Connection Limiting Zones ---
# General traffic: 15 req/sec per IP with burst 30
limit_req_zone $binary_remote_addr zone=general_req:10m rate=15r/s;
# Login endpoint: 10 req/min per IP with burst 20 (prevents lockouts on shared NAT IPs)
limit_req_zone $binary_remote_addr zone=login_req:10m rate=10r/m;
# WebSocket Socket.IO carved-out zone: 60 req/sec per IP with burst 100
limit_req_zone $binary_remote_addr zone=socketio_req:10m rate=60r/s;
# Connection limiting: max concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

upstream ideahub_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

limit_req_status 429;
limit_conn_status 429;

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name idea-flows.online www.idea-flows.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name idea-flows.online www.idea-flows.online;

    # --- Drop Bad Bots & Scrapers ---
    # Return 444 closes connection immediately with zero response,
    # saving vCPU cycles and denying status code fingerprinting.
    if ($bad_bot) {
        return 444;
    }

    # --- Slowloris & Slow-HTTP Attack Mitigation ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # --- SSL Certificates (managed by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/idea-flows.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idea-flows.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-XSS-Protection          "1; mode=block"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Serve robots.txt directly ---
    location = /robots.txt {
        alias /var/www/ideahub/static/robots.txt;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # Uploaded media has unique names and can be cached immutably.
    location /static/uploads/ {
        alias /var/www/ideahub/static/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # App CSS/JS can change at the same URL between deployments.
    location /static/ {
        alias /var/www/ideahub/static/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location = /health/live {
        proxy_pass http://ideahub_app;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://ideahub_app;
        access_log off;
    }

    # --- WebSocket support for Flask-SocketIO (Carved out from global limits) ---
    # Must come BEFORE the catch-all / block
    location /socket.io/ {
        limit_req zone=socketio_req burst=100 nodelay;
        limit_conn conn_ip 50;

        proxy_pass         http://ideahub_app/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Dedicated login rate limit (loosened burst for shared NAT / office WiFi) ---
    location = /api/login {
        limit_req zone=login_req burst=20 nodelay;
        limit_conn conn_ip 10;

        proxy_pass         http://ideahub_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Proxy all other requests to gunicorn ---
    location / {
        limit_req zone=general_req burst=30 nodelay;
        limit_conn conn_ip 20;

        proxy_pass         http://ideahub_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Allow menu image uploads up to 10MB
        client_max_body_size 10m;
    }

    # --- Custom error pages ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
