# Phase 1 production stabilization override.
#
# Install as:
#   /etc/systemd/system/ideahub.service.d/phase1-socketio.conf
#
# This deliberately changes only ExecStart. It preserves the active unit's user,
# group, working directory, environment, restart policy, and hardening settings.
[Service]
ExecStart=
ExecStart=/var/www/pos/venv/bin/gunicorn --no-sendfile --worker-class eventlet --workers 1 --bind 127.0.0.1:5000 --timeout 120 --graceful-timeout 30 --keep-alive 5 wsgi:application
