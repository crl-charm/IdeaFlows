<div class="pwa-install" data-pwa-install hidden>
  <button type="button" class="btn btn-outline-secondary w-100" data-pwa-install-button>
    <i class="bi bi-download" aria-hidden="true"></i>
    <span>Install IdeaFlow</span>
  </button>
  <p class="pwa-install-status" data-pwa-install-status role="status" aria-live="polite"></p>
</div>

<dialog class="pwa-install-dialog" data-pwa-ios-instructions aria-labelledby="pwa-install-title">
  <form method="dialog">
    <h2 id="pwa-install-title">Install IdeaFlow</h2>
    <p>In Safari, tap <strong>Share</strong>, then choose <strong>Add to Home Screen</strong>.</p>
    <button type="submit" class="btn btn-login" data-pwa-close>Got it</button>
  </form>
</dialog>
