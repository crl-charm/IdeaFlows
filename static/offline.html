<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a4f43">
  <title>IdeaFlow — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #fef9f0; color: #17211e; font: 1rem/1.6 system-ui, sans-serif; }
    main { width: min(30rem, 100%); border: 1px solid #e8dfc9; border-radius: 1rem; padding: 2rem; background: #fff; text-align: center; box-shadow: 0 1rem 3rem rgb(42 79 67 / 12%); }
    img { width: 5rem; height: 5rem; }
    h1 { margin: 1rem 0 .5rem; }
    button { border: 0; border-radius: .5rem; padding: .75rem 1.25rem; background: #2a4f43; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="IdeaFlow">
    <h1>You’re offline</h1>
    <p>IdeaFlow needs an internet connection for live business data. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
